name: deploy

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Cloning repo
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Push to dokku
              uses: dokku/github-action@a38b28b1f65617ee2b12e0ca96315fd5f889292f # master
              with:
                  branch: main
                  git_remote_url: "ssh://dokku@github-bot.eslint.org/eslint-github-bot"
                  ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
